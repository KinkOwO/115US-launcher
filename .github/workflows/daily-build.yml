name: Daily Build & Release

on:
  schedule:
    # 每天 UTC 22:00 = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: KinkOwO/115US-launcher
          fetch-depth: 0
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Check if there are new commits
        id: check
        shell: pwsh
        run: |
          $latest = git rev-parse HEAD
          echo "latest=$latest" >> $env:GITHUB_OUTPUT
          # 检查最新 Release 的 tag 是否已经是这个 commit
          $releases = gh release list --limit 1 2>&1
          echo "releases=$releases"
          if ($releases -match $latest.Substring(0,7)) {
            echo "has_new=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "has_new=true" >> $env:GITHUB_OUTPUT
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        if: steps.check.outputs.has_new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        if: steps.check.outputs.has_new == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.check.outputs.has_new == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        if: steps.check.outputs.has_new == 'true'
        run: npm install

      - name: Build Tauri
        if: steps.check.outputs.has_new == 'true'
        run: npx tauri build --no-bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.check.outputs.has_new == 'true'
        shell: pwsh
        run: |
          $sha = "${{ steps.check.outputs.latest }}"
          $short = $sha.Substring(0,7)
          $date = Get-Date -Format "yyyyMMdd-HHmm"
          $tag = "v$date-$short"
          $exe = "src-tauri/target/release/dfo-launcher.exe"
          gh release create $tag $exe --title "Build $tag" --notes "Auto build from KinkOwO/115US-launcher@$short"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
